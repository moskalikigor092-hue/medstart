name: Deploy MedStart to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Download photos from Unsplash
        run: |
          mkdir -p img
          grep -v '^#' images.txt | while read -r name id width; do
            [ -z "$name" ] && continue
            [ -f "img/$name" ] && continue
            curl -fsSL "https://images.unsplash.com/photo-${id}?w=${width}&q=78&fm=jpg&fit=crop" -o "img/$name"
            echo "downloaded img/$name"
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
